name: Tests und Installationspaket
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/frontend-unit.cjs tests/image-upload-unit.cjs tests/panel-unit.cjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/frontend.cjs
      - name: Tag und Manifest abgleichen
        if: github.ref_type == 'tag'
        run: |
          python -c 'import json, os; from pathlib import Path; version=json.loads(Path("custom_components/essensplan/manifest.json").read_text())["version"]; assert os.environ["GITHUB_REF_NAME"] == "v"+version, "Tag und Manifest müssen dieselbe Version haben"'
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: essensplan-installationspaket
          path: dist/essensplan-*.zip
          if-no-files-found: error
