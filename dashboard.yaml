# Optionales eigenes Dashboard, URL: /essensplan-plan
# Unter Einstellungen → Dashboards ein leeres Dashboard mit URL „essensplan-plan“
# erstellen und diesen Inhalt in dessen Rohkonfigurationseditor einsetzen.
# Die Karte bringt ihre eigene Navigation (Heute, Woche, Rezepte, Einkauf) mit.
# Deshalb gibt es nur eine sichtbare Ansicht. Die Unterseiten halten Verknüpfungen
# wie /essensplan-plan/woche lauffähig und erscheinen nicht als Tabs.
title: Essensplan
background:
  image: /essensplan_static/dashboard-background.svg?v=0.6.3
  opacity: 100
  size: cover
views:
  - title: Essensplan
    path: heute
    icon: mdi:silverware-fork-knife
    cards:
      - type: custom:essensplan-card
        mode: today
        title: Heute auf dem Tisch
  - title: Wochenplan
    path: woche
    subview: true
    back_path: /essensplan-plan/heute
    cards:
      - type: custom:essensplan-card
        mode: week
  - title: Rezept
    path: rezept
    subview: true
    back_path: /essensplan-plan/heute
    cards:
      - type: custom:essensplan-card
        mode: detail
  - title: Rezepte
    path: rezepte
    subview: true
    back_path: /essensplan-plan/heute
    cards:
      - type: custom:essensplan-card
        mode: recipes
  - title: Einkauf
    path: einkauf
    subview: true
    back_path: /essensplan-plan/heute
    cards:
      - type: custom:essensplan-card
        mode: shopping
